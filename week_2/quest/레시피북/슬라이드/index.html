<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15분 레시피북 — 발표자료</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정: Babel 8.x는 인라인 text/babel 처리가 깨지므로 반드시 7.x 사용 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    * { -webkit-font-smoothing: antialiased; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo',
        'Malgun Gothic', 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: none;
    }
    .slides-track { transition: transform 700ms cubic-bezier(0.4, 0, 0.2, 1); }
    .glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
</head>
<body class="overflow-hidden bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // Data
    // ========================================
    const RECIPES = [
      {
        id: 'tomato-egg',
        num: '01',
        title: '토마토 계란볶음',
        subtitle: '중식당 인기 메뉴 시안펀시홍스를 간단하게. 밥 위에 얹어도, 반찬으로도 완벽해요.',
        emoji: '🍅',
        hex: '#FF3B30',
        prep: 5, cook: 10, servings: '2인분',
        ingredients: ['토마토 2개', '계란 3개', '대파 1/2대', '다진마늘 1작은술', '굴소스 1큰술', '설탕 1/2작은술'],
        steps: ['계란 풀기', '계란 볶기', '마늘·대파 향내기', '토마토 볶기', '계란 합치기'],
        tip: '계란은 너무 오래 볶지 말고 촉촉한 반숙으로 두면 훨씬 부드러워요.',
      },
      {
        id: 'kimchi-spam',
        num: '02',
        title: '김치 스팸 볶음밥',
        subtitle: '냉장고 속 김치와 스팸만 있으면 뚝딱 완성되는 든든한 한 끼.',
        emoji: '🍚',
        hex: '#FF9500',
        prep: 5, cook: 10, servings: '2인분',
        ingredients: ['밥 2공기', '신김치 1컵', '스팸 1/2캔', '대파 1/2대', '고춧가루 1작은술', '참기름 1큰술'],
        steps: ['재료 손질', '스팸 굽기', '김치 볶기', '밥 볶기', '마무리 토핑'],
        tip: '찬밥을 쓰면 밥알이 뭉치지 않고 더 고슬고슬해요.',
      },
      {
        id: 'aglio-olio',
        num: '03',
        title: '알리오 올리오 파스타',
        subtitle: '마늘과 올리브오일만으로 만드는 이탈리아 정통 파스타. 재료는 적어도 풍미는 확실해요.',
        emoji: '🍝',
        hex: '#34C759',
        prep: 5, cook: 10, servings: '2인분',
        ingredients: ['스파게티 200g', '마늘 6~7쪽', '페페론치노 3~4개', '올리브오일 5큰술', '파슬리 2큰술', '파마산 치즈'],
        steps: ['면 삶기', '마늘 오일 내기', '면과 유화시키기', '간 맞추기', '파슬리 마무리'],
        tip: '마늘을 태우면 쓴맛이 나니 약불에서 천천히 볶는 게 핵심이에요.',
      },
      {
        id: 'tuna-mayo',
        num: '04',
        title: '참치 마요 덮밥',
        subtitle: '캔 참치와 마요네즈로 만드는 초간단 덮밥. 자취생 최애 메뉴로 유명해요.',
        emoji: '🐟',
        hex: '#FF2D55',
        prep: 5, cook: 10, servings: '2인분',
        ingredients: ['밥 2공기', '참치캔 1개', '마요네즈 3큰술', '양파 1/4개', '대파 1/2대', '계란 노른자 2개'],
        steps: ['양파 절이기', '참치 소스 만들기', '살짝 볶기', '밥에 올리기', '토핑 마무리'],
        tip: '참치 기름을 꼭 빼야 느끼하지 않고 깔끔한 맛이 나요.',
      },
      {
        id: 'mug-cake',
        num: '05',
        title: '머그컵 초코케이크',
        subtitle: '전자레인지 하나로 뚝딱 만드는 촉촉한 초콜릿 케이크. 갑자기 단 게 당길 때 딱이에요.',
        emoji: '🍫',
        hex: '#A2845E',
        prep: 5, cook: 2, servings: '1인분',
        ingredients: ['박력분 4큰술', '설탕 3큰술', '코코아파우더 2큰술', '우유 4큰술', '식용유 2큰술', '초코칩 1큰술'],
        steps: ['가루 섞기', '액체 재료 섞기', '초코칩 넣기', '전자레인지 돌리기', '한 김 식히기'],
        tip: '너무 오래 돌리면 퍽퍽해지니 1분 30초부터 확인하며 추가하세요.',
      },
    ];

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function IconButton({ children, onClick, ariaLabel, className = '' }) {
      return (
        <button
          type="button"
          onClick={onClick}
          aria-label={ariaLabel}
          className={`glass w-11 h-11 rounded-full flex items-center justify-center text-gray-700
            shadow-lg hover:scale-105 active:scale-95 transition focus:outline-none focus:ring-2 focus:ring-gray-400 ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, hex }) {
      const style = hex
        ? { backgroundColor: hexToRgba(hex, 0.12), color: hex }
        : { backgroundColor: 'rgba(0,0,0,0.06)', color: '#374151' };
      return (
        <span style={style} className="px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold whitespace-nowrap">
          {children}
        </span>
      );
    }

    function PrimaryButton({ children, onClick, hex }) {
      return (
        <button
          type="button"
          onClick={onClick}
          style={{ backgroundColor: hex || '#0071e3' }}
          className="px-7 py-3 rounded-full text-white font-semibold text-base shadow-lg hover:brightness-110 active:scale-95 transition"
        >
          {children}
        </button>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================

    function StepTracker({ steps, hex }) {
      return (
        <div className="flex items-start justify-center gap-0 w-full max-w-2xl mx-auto">
          {steps.map((step, i) => (
            <React.Fragment key={i}>
              <div className="flex flex-col items-center gap-2 w-16 sm:w-20 flex-shrink-0">
                <div
                  style={{ backgroundColor: hex }}
                  className="w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center text-white text-xs sm:text-sm font-bold shadow-sm"
                >
                  {i + 1}
                </div>
                <p className="text-[11px] sm:text-xs text-gray-500 text-center leading-tight">{step}</p>
              </div>
              {i < steps.length - 1 && (
                <div className="flex-1 h-px bg-gray-200 mt-4 sm:mt-4.5" />
              )}
            </React.Fragment>
          ))}
        </div>
      );
    }

    function SlideCounter({ current, total }) {
      return (
        <div className="fixed top-6 right-6 z-30 glass px-4 py-1.5 rounded-full text-sm font-medium text-gray-700 shadow">
          {current + 1} / {total}
        </div>
      );
    }

    function DotNav({ total, current, onSelect }) {
      return (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-30 glass px-4 py-2.5 rounded-full shadow flex items-center gap-2.5">
          {Array.from({ length: total }).map((_, i) => (
            <button
              key={i}
              type="button"
              aria-label={`${i + 1}번 슬라이드로 이동`}
              onClick={() => onSelect(i)}
              className={`rounded-full transition-all ${i === current ? 'w-6 h-2 bg-gray-800' : 'w-2 h-2 bg-gray-400 hover:bg-gray-500'}`}
            />
          ))}
        </div>
      );
    }

    function ArrowNav({ onPrev, onNext, hasPrev, hasNext }) {
      return (
        <React.Fragment>
          <div className="fixed left-4 sm:left-6 top-1/2 -translate-y-1/2 z-30">
            <IconButton onClick={onPrev} ariaLabel="이전 슬라이드" className={hasPrev ? '' : 'opacity-0 pointer-events-none'}>
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </IconButton>
          </div>
          <div className="fixed right-4 sm:right-6 top-1/2 -translate-y-1/2 z-30">
            <IconButton onClick={onNext} ariaLabel="다음 슬라이드" className={hasNext ? '' : 'opacity-0 pointer-events-none'}>
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </IconButton>
          </div>
        </React.Fragment>
      );
    }

    // ========================================
    // 📄 Slide (Page) Components
    // ========================================

    function TitleSlide({ onStart }) {
      return (
        <div className="w-screen h-screen flex-shrink-0 bg-black text-white flex flex-col items-center justify-center px-6 text-center">
          <div className="text-7xl sm:text-8xl mb-8">🍳</div>
          <p className="text-gray-400 tracking-[0.3em] text-xs sm:text-sm font-semibold mb-4">RECIPE BOOK</p>
          <h1 className="text-5xl sm:text-7xl font-bold tracking-tight leading-tight">
            15분 레시피북
          </h1>
          <p className="mt-6 text-lg sm:text-2xl text-gray-400 max-w-xl">
            바쁜 하루에도, 다섯 가지 초스피드 집밥이면 충분해요.
          </p>
          <div className="mt-12">
            <PrimaryButton onClick={onStart}>시작하기</PrimaryButton>
          </div>
          <p className="mt-8 text-xs text-gray-600">→ 방향키 또는 하단 점을 눌러 넘겨보세요</p>
        </div>
      );
    }

    function OverviewSlide({ onJump }) {
      return (
        <div className="w-screen h-screen flex-shrink-0 bg-white flex flex-col items-center justify-center px-6 sm:px-16">
          <p className="text-gray-400 tracking-[0.3em] text-xs sm:text-sm font-semibold mb-3">CONTENTS</p>
          <h2 className="text-3xl sm:text-5xl font-bold text-gray-900 tracking-tight text-center">
            오늘 소개할 5가지 레시피
          </h2>
          <div className="mt-10 sm:mt-14 grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5 max-w-4xl w-full">
            {RECIPES.map((r, i) => (
              <button
                key={r.id}
                onClick={() => onJump(i + 2)}
                style={{ '--tw-ring-color': r.hex }}
                className="group text-left bg-gray-50 hover:bg-gray-100 rounded-2xl p-4 sm:p-5 transition border border-gray-100 hover:border-gray-200 focus:outline-none focus:ring-2"
              >
                <div
                  style={{ backgroundColor: hexToRgba(r.hex, 0.14) }}
                  className="w-11 h-11 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center text-2xl mb-3"
                >
                  {r.emoji}
                </div>
                <p className="text-[11px] font-semibold" style={{ color: r.hex }}>{r.num}</p>
                <p className="font-bold text-gray-900 text-sm sm:text-base leading-snug mt-0.5">{r.title}</p>
                <p className="text-xs text-gray-400 mt-1">{r.prep + r.cook}분 · {r.servings}</p>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function RecipeSlide({ recipe }) {
      return (
        <div className="w-screen h-screen flex-shrink-0 bg-white flex items-center justify-center px-6 sm:px-10">
          <div className="w-full max-w-4xl flex flex-col items-center text-center gap-5 sm:gap-6">
            <div className="flex items-center gap-3">
              <span className="text-sm font-semibold" style={{ color: recipe.hex }}>RECIPE {recipe.num}</span>
              <Badge hex={recipe.hex}>⏱ {recipe.prep + recipe.cook}분 완성</Badge>
              <Badge>{recipe.servings}</Badge>
            </div>

            <div
              style={{ backgroundColor: hexToRgba(recipe.hex, 0.14) }}
              className="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl flex items-center justify-center text-5xl sm:text-6xl"
            >
              {recipe.emoji}
            </div>

            <h2 className="text-3xl sm:text-5xl font-bold text-gray-900 tracking-tight">{recipe.title}</h2>
            <p className="text-sm sm:text-lg text-gray-500 max-w-2xl leading-relaxed">{recipe.subtitle}</p>

            <div className="flex flex-wrap justify-center gap-2 max-w-2xl">
              {recipe.ingredients.map((ing) => (
                <Badge key={ing} hex={recipe.hex}>{ing}</Badge>
              ))}
            </div>

            <div className="w-full pt-2">
              <StepTracker steps={recipe.steps} hex={recipe.hex} />
            </div>

            <div
              style={{ borderColor: recipe.hex, backgroundColor: hexToRgba(recipe.hex, 0.06) }}
              className="mt-1 max-w-xl border-l-4 rounded-r-xl px-4 py-3 text-left"
            >
              <p className="text-xs sm:text-sm text-gray-700">
                <span className="mr-1.5">💡</span>{recipe.tip}
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ClosingSlide({ onRestart }) {
      return (
        <div className="w-screen h-screen flex-shrink-0 bg-black text-white flex flex-col items-center justify-center px-6 text-center">
          <div className="flex gap-3 mb-8">
            {RECIPES.map((r) => (
              <span
                key={r.id}
                style={{ backgroundColor: hexToRgba(r.hex, 0.18), color: r.hex }}
                className="w-11 h-11 rounded-full flex items-center justify-center text-xl"
              >
                {r.emoji}
              </span>
            ))}
          </div>
          <h2 className="text-4xl sm:text-6xl font-bold tracking-tight">맛있게 드세요 🍽️</h2>
          <p className="mt-5 text-base sm:text-xl text-gray-400 max-w-lg">
            15분이면 충분해요. 오늘 저녁, 다섯 가지 레시피 중 하나를 만들어보세요.
          </p>
          <div className="mt-10">
            <PrimaryButton onClick={onRestart}>처음으로</PrimaryButton>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const slideCount = RECIPES.length + 3; // title + overview + 5 recipes + closing
      const [index, setIndex] = useState(0);
      const touchStartX = useRef(null);

      const goTo = useCallback((i) => {
        setIndex(Math.max(0, Math.min(slideCount - 1, i)));
      }, [slideCount]);

      const next = useCallback(() => goTo(index + 1), [goTo, index]);
      const prev = useCallback(() => goTo(index - 1), [goTo, index]);

      useEffect(() => {
        const onKeyDown = (e) => {
          if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
            e.preventDefault();
            next();
          } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
            e.preventDefault();
            prev();
          } else if (e.key === 'Home') {
            e.preventDefault();
            goTo(0);
          } else if (e.key === 'End') {
            e.preventDefault();
            goTo(slideCount - 1);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [next, prev, goTo, slideCount]);

      const onTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };
      const onTouchEnd = (e) => {
        if (touchStartX.current === null) return;
        const delta = e.changedTouches[0].clientX - touchStartX.current;
        if (delta < -50) next();
        else if (delta > 50) prev();
        touchStartX.current = null;
      };

      return (
        <div
          className="relative w-screen h-screen overflow-hidden select-none"
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
        >
          <div
            className="slides-track flex h-full"
            style={{ width: `${slideCount * 100}vw`, transform: `translateX(-${index * 100}vw)` }}
          >
            <TitleSlide onStart={() => goTo(1)} />
            <OverviewSlide onJump={goTo} />
            {RECIPES.map((r) => (
              <RecipeSlide key={r.id} recipe={r} />
            ))}
            <ClosingSlide onRestart={() => goTo(0)} />
          </div>

          <SlideCounter current={index} total={slideCount} />
          <ArrowNav onPrev={prev} onNext={next} hasPrev={index > 0} hasNext={index < slideCount - 1} />
          <DotNav total={slideCount} current={index} onSelect={goTo} />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
