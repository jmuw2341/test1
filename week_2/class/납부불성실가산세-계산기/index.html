<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>납부불성실가산세 계산기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정: Babel 은 반드시 7.x -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-animate { animation: fadeInUp 0.35s ease-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-white to-amber-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-lg shadow-slate-200/60 ring-1 ring-slate-100 p-6 sm:p-8 ${className}`}>
          {children}
        </div>
      );
    }

    function Input({ label, type = 'text', value, onChange, placeholder, error, id, hint, ...rest }) {
      return (
        <div className="flex flex-col gap-1.5">
          {label && (
            <label htmlFor={id} className="text-sm font-medium text-slate-700">
              {label}
            </label>
          )}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border px-4 py-2.5 text-slate-800 shadow-sm outline-none transition
              focus:ring-2 focus:ring-rose-400 focus:border-rose-400
              ${error ? 'border-red-400' : 'border-slate-200'}`}
            {...rest}
          />
          {hint && !error && <p className="text-xs text-slate-400">{hint}</p>}
          {error && (
            <p id={`${id}-error`} className="text-sm text-red-500">{error}</p>
          )}
        </div>
      );
    }

    function Button({ children, variant = 'primary', size = 'md', disabled, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-rose-600 text-white hover:bg-rose-700 focus:ring-rose-400',
        secondary: 'bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-300',
        ghost: 'bg-transparent text-rose-600 hover:bg-rose-50 focus:ring-rose-300',
      };
      const sizes = {
        sm: 'text-sm px-3 py-1.5',
        md: 'text-base px-4 py-2.5',
        lg: 'text-lg px-6 py-3',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, tone = 'rose' }) {
      const tones = {
        rose: 'bg-rose-50 text-rose-700 ring-rose-200',
        slate: 'bg-slate-50 text-slate-600 ring-slate-200',
        green: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ring-1 ${tones[tone]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    // 국세기본법 제47조의4 및 시행령상 납부지연가산세(구 납부불성실가산세) 일 이자율 연혁
    const RATE_PERIODS = [
      { from: null, to: '2019-02-11', rate: 0.0003, label: '~2019.02.11' },       // 1일 3/10,000
      { from: '2019-02-12', to: '2022-02-14', rate: 0.000025, label: '2019.02.12~2022.02.14' }, // 1일 2.5/10,000
      { from: '2022-02-15', to: null, rate: 0.000022, label: '2022.02.15~현재' }, // 1일 2.2/10,000
    ];
    const FAR_PAST = new Date('1900-01-01T00:00:00');
    const FAR_FUTURE = new Date('9999-12-31T00:00:00');

    function toDate(str) {
      return new Date(str + 'T00:00:00');
    }

    function formatDateInput(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function daysInclusive(a, b) {
      return Math.round((b - a) / (1000 * 60 * 60 * 24)) + 1;
    }

    function formatNumber(n) {
      return n.toLocaleString('ko-KR');
    }

    function formatWon(n) {
      return `${formatNumber(Math.round(n))}원`;
    }

    // 미납세액 × 미납일수 × 구간별 이자율을 적용해 가산세를 계산한다.
    function calcPenalty(taxAmount, dueDateStr, payDateStr) {
      const dueDate = toDate(dueDateStr);
      const payDate = toDate(payDateStr);
      const rangeStart = new Date(dueDate.getTime() + 24 * 60 * 60 * 1000); // 납부기한 다음날부터 기산
      const rangeEnd = payDate;

      if (rangeEnd < rangeStart) {
        return { totalDays: 0, totalPenalty: 0, breakdown: [] };
      }

      const breakdown = [];
      let totalDays = 0;
      let totalPenalty = 0;

      RATE_PERIODS.forEach((period) => {
        const periodStart = period.from ? toDate(period.from) : FAR_PAST;
        const periodEnd = period.to ? toDate(period.to) : FAR_FUTURE;
        const overlapStart = rangeStart > periodStart ? rangeStart : periodStart;
        const overlapEnd = rangeEnd < periodEnd ? rangeEnd : periodEnd;

        if (overlapStart <= overlapEnd) {
          const days = daysInclusive(overlapStart, overlapEnd);
          const penalty = taxAmount * days * period.rate;
          totalDays += days;
          totalPenalty += penalty;
          breakdown.push({
            label: period.label,
            rate: period.rate,
            days,
            penalty,
          });
        }
      });

      return { totalDays, totalPenalty, breakdown };
    }

    function BreakdownTable({ breakdown }) {
      return (
        <div className="overflow-x-auto rounded-xl ring-1 ring-slate-100">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-slate-50 text-slate-500">
                <th className="px-3 py-2 text-left font-medium">적용 기간</th>
                <th className="px-3 py-2 text-right font-medium">일수</th>
                <th className="px-3 py-2 text-right font-medium">일 이율</th>
                <th className="px-3 py-2 text-right font-medium">가산세</th>
              </tr>
            </thead>
            <tbody>
              {breakdown.map((row) => (
                <tr key={row.label} className="border-t border-slate-100 text-slate-700">
                  <td className="px-3 py-2">{row.label}</td>
                  <td className="px-3 py-2 text-right">{formatNumber(row.days)}일</td>
                  <td className="px-3 py-2 text-right">{(row.rate * 100).toFixed(4)}%</td>
                  <td className="px-3 py-2 text-right font-medium">{formatWon(row.penalty)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function ResultRow({ label, value, highlight = false }) {
      return (
        <div className={`flex items-center justify-between rounded-xl px-4 py-3 ${highlight ? 'bg-rose-600 text-white' : 'bg-slate-50 text-slate-700'}`}>
          <span className={`text-sm font-medium ${highlight ? 'text-rose-100' : 'text-slate-500'}`}>{label}</span>
          <span className={`font-bold ${highlight ? 'text-2xl' : 'text-lg'}`}>{value}</span>
        </div>
      );
    }

    function PenaltyCalculatorPage() {
      const today = useMemo(() => formatDateInput(new Date()), []);
      const [taxAmountInput, setTaxAmountInput] = useState('');
      const [dueDate, setDueDate] = useState('');
      const [payDate, setPayDate] = useState(today);

      const taxAmount = useMemo(() => {
        const digits = taxAmountInput.replace(/[^0-9]/g, '');
        return digits ? parseInt(digits, 10) : 0;
      }, [taxAmountInput]);

      const handleAmountChange = useCallback((e) => {
        const digits = e.target.value.replace(/[^0-9]/g, '');
        setTaxAmountInput(digits);
      }, []);

      const handleReset = useCallback(() => {
        setTaxAmountInput('');
        setDueDate('');
        setPayDate(today);
      }, [today]);

      const dateError = useMemo(() => {
        if (dueDate && payDate && toDate(payDate) < toDate(dueDate)) {
          return '계산기준일(납부일)은 법정납부기한보다 이전일 수 없어요.';
        }
        return '';
      }, [dueDate, payDate]);

      const result = useMemo(() => {
        if (!taxAmount || !dueDate || !payDate || dateError) return null;
        return calcPenalty(taxAmount, dueDate, payDate);
      }, [taxAmount, dueDate, payDate, dateError]);

      const canCalculate = taxAmount > 0 && dueDate && payDate && !dateError;

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-12">
          <div className="w-full max-w-xl">
            <div className="text-center mb-8">
              <h1 className="text-3xl font-extrabold text-slate-800 mb-2">🧾 납부불성실가산세 계산기</h1>
              <p className="text-slate-500 text-sm">
                국세를 법정납부기한까지 내지 않았을 때 붙는 <span className="font-semibold text-rose-600">납부지연가산세(구 납부불성실가산세)</span>를 간편 추정합니다.
              </p>
            </div>

            <Card>
              <div className="flex flex-col gap-5">
                <Input
                  id="taxAmount"
                  label="미납(과소납부) 세액"
                  inputMode="numeric"
                  value={taxAmountInput ? formatNumber(taxAmount) : ''}
                  onChange={handleAmountChange}
                  placeholder="예: 3,000,000"
                  hint="원 단위로 입력하세요."
                />

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <Input
                    id="dueDate"
                    label="법정납부기한"
                    type="date"
                    value={dueDate}
                    onChange={(e) => setDueDate(e.target.value)}
                    max={today}
                  />
                  <Input
                    id="payDate"
                    label="계산기준일 (납부일)"
                    type="date"
                    value={payDate}
                    onChange={(e) => setPayDate(e.target.value)}
                    error={dateError}
                  />
                </div>

                <div className="flex gap-2">
                  <Button variant="secondary" size="md" className="flex-1" onClick={handleReset}>
                    초기화
                  </Button>
                </div>

                {!canCalculate && (
                  <p className="text-center text-sm text-slate-400 pt-2">
                    미납세액, 법정납부기한, 계산기준일을 모두 입력하면 결과가 표시됩니다.
                  </p>
                )}

                {result && (
                  <div className="result-animate flex flex-col gap-4 pt-2 border-t border-slate-100">
                    {result.totalDays === 0 ? (
                      <Badge tone="green">✅ 기한 내 납부로 가산세가 없어요.</Badge>
                    ) : (
                      <React.Fragment>
                        <div className="flex flex-wrap gap-2">
                          <Badge tone="slate">미납일수 {formatNumber(result.totalDays)}일</Badge>
                          <Badge tone="rose">가산세율 적용 구간 {result.breakdown.length}개</Badge>
                        </div>

                        <BreakdownTable breakdown={result.breakdown} />

                        <ResultRow label="납부지연가산세 합계" value={formatWon(result.totalPenalty)} highlight />
                        <ResultRow label="총 납부할 금액 (세액+가산세)" value={formatWon(taxAmount + result.totalPenalty)} />
                      </React.Fragment>
                    )}
                  </div>
                )}
              </div>
            </Card>

            <p className="text-center text-xs text-slate-400 mt-6 leading-relaxed">
              계산식: 미납세액 × 미납일수 × 일 이자율 (2022.02.15~ 1일 0.022%, 2019.02.12~2022.02.14 1일 0.025%, ~2019.02.11 1일 0.03%)<br />
              본 계산기는 참고용 추정치이며, 원천징수 등 세목별 특례·소액부징수 규정은 반영하지 않았습니다. 정확한 금액은 국세청 홈택스 또는 관할 세무서에서 확인하세요.
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <PenaltyCalculatorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
