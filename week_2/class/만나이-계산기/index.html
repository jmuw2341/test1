<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 만나이 계산기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정: Babel 은 반드시 7.x -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-animate { animation: fadeInUp 0.35s ease-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-white to-indigo-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-lg shadow-slate-200/60 ring-1 ring-slate-100 p-6 sm:p-8 ${className}`}>
          {children}
        </div>
      );
    }

    function Input({ label, type = 'text', value, onChange, placeholder, error, id, ...rest }) {
      return (
        <div className="flex flex-col gap-1.5">
          {label && (
            <label htmlFor={id} className="text-sm font-medium text-slate-700">
              {label}
            </label>
          )}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border px-4 py-2.5 text-slate-800 shadow-sm outline-none transition
              focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400
              ${error ? 'border-red-400' : 'border-slate-200'}`}
            {...rest}
          />
          {error && (
            <p id={`${id}-error`} className="text-sm text-red-500">{error}</p>
          )}
        </div>
      );
    }

    function Button({ children, variant = 'primary', size = 'md', disabled, onClick, className = '', type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-400',
        secondary: 'bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-300',
        ghost: 'bg-transparent text-indigo-600 hover:bg-indigo-50 focus:ring-indigo-300',
      };
      const sizes = {
        sm: 'text-sm px-3 py-1.5',
        md: 'text-base px-4 py-2.5',
        lg: 'text-lg px-6 py-3',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ children, tone = 'indigo' }) {
      const tones = {
        indigo: 'bg-indigo-50 text-indigo-700 ring-indigo-200',
        slate: 'bg-slate-50 text-slate-600 ring-slate-200',
        amber: 'bg-amber-50 text-amber-700 ring-amber-200',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ring-1 ${tones[tone]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    function formatDateInput(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function calcAges(birthDateStr, refDateStr) {
      const birth = new Date(birthDateStr + 'T00:00:00');
      const ref = new Date(refDateStr + 'T00:00:00');

      // 만 나이 (international age): 생일이 지났으면 (기준연도 - 출생연도), 아니면 -1
      let manAge = ref.getFullYear() - birth.getFullYear();
      const hasHadBirthdayThisYear =
        ref.getMonth() > birth.getMonth() ||
        (ref.getMonth() === birth.getMonth() && ref.getDate() >= birth.getDate());
      if (!hasHadBirthdayThisYear) manAge -= 1;

      // 연 나이 (year age, 병역법 등에서 쓰는 방식): 기준연도 - 출생연도
      const yearAge = ref.getFullYear() - birth.getFullYear();

      // 세는 나이 (counting age, 옛 관습 나이): 기준연도 - 출생연도 + 1
      const countingAge = ref.getFullYear() - birth.getFullYear() + 1;

      // 다음 생일까지 남은 일수
      const refMid = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
      let nextBirthday = new Date(refMid.getFullYear(), birth.getMonth(), birth.getDate());
      if (nextBirthday < refMid) nextBirthday = new Date(refMid.getFullYear() + 1, birth.getMonth(), birth.getDate());
      const daysUntilBirthday = Math.round((nextBirthday - refMid) / (1000 * 60 * 60 * 24));

      return { manAge, yearAge, countingAge, daysUntilBirthday, isBirthdayToday: daysUntilBirthday === 0 };
    }

    function ResultRow({ label, value, unit = '세', highlight = false }) {
      return (
        <div className={`flex items-center justify-between rounded-xl px-4 py-3 ${highlight ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-700'}`}>
          <span className={`text-sm font-medium ${highlight ? 'text-indigo-100' : 'text-slate-500'}`}>{label}</span>
          <span className={`font-bold ${highlight ? 'text-2xl' : 'text-lg'}`}>{value}{unit}</span>
        </div>
      );
    }

    function AgeCalculatorPage() {
      const today = useMemo(() => formatDateInput(new Date()), []);
      const [birthDate, setBirthDate] = useState('');
      const [refDate, setRefDate] = useState(today);

      const handleBirthChange = useCallback((e) => {
        setBirthDate(e.target.value);
      }, []);

      const handleReset = useCallback(() => {
        setBirthDate('');
        setRefDate(today);
      }, [today]);

      const validationError = useMemo(() => {
        if (!birthDate) return '';
        const birth = new Date(birthDate + 'T00:00:00');
        const ref = new Date(refDate + 'T00:00:00');
        if (birth > ref) return '생년월일은 기준일보다 이전이어야 해요.';
        return '';
      }, [birthDate, refDate]);

      const result = useMemo(() => {
        if (!birthDate || validationError) return null;
        return calcAges(birthDate, refDate);
      }, [birthDate, refDate, validationError]);

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-12">
          <div className="w-full max-w-md">
            <div className="text-center mb-8">
              <h1 className="text-3xl font-extrabold text-slate-800 mb-2">🎂 한국 만나이 계산기</h1>
              <p className="text-slate-500 text-sm">
                생년월일을 입력하면 2023년 6월부터 시행된 <span className="font-semibold text-indigo-600">만 나이</span> 기준으로 계산해드려요.
              </p>
            </div>

            <Card>
              <div className="flex flex-col gap-5">
                <Input
                  id="birthDate"
                  label="생년월일"
                  type="date"
                  value={birthDate}
                  onChange={handleBirthChange}
                  max={today}
                  error={validationError}
                />
                <Input
                  id="refDate"
                  label="기준일 (기본값: 오늘)"
                  type="date"
                  value={refDate}
                  onChange={(e) => setRefDate(e.target.value)}
                />

                <div className="flex gap-2">
                  <Button variant="secondary" size="md" className="flex-1" onClick={handleReset}>
                    초기화
                  </Button>
                </div>

                {result && (
                  <div className="result-animate flex flex-col gap-3 pt-2 border-t border-slate-100">
                    <ResultRow label="만 나이 (현재 공식 나이)" value={result.manAge} highlight />
                    <ResultRow label="연 나이 (올해 기준 연도차)" value={result.yearAge} />
                    <ResultRow label="세는 나이 (전통 나이)" value={result.countingAge} />

                    <div className="mt-1">
                      {result.isBirthdayToday ? (
                        <Badge tone="amber">🎉 오늘이 생일이에요!</Badge>
                      ) : (
                        <Badge tone="slate">
                          다음 생일까지 {result.daysUntilBirthday}일 남음
                        </Badge>
                      )}
                    </div>
                  </div>
                )}

                {!birthDate && (
                  <p className="text-center text-sm text-slate-400 pt-2">
                    생년월일을 입력하면 결과가 표시됩니다.
                  </p>
                )}
              </div>
            </Card>

            <p className="text-center text-xs text-slate-400 mt-6">
              만 나이 = 기준일 기준으로 생일이 지났으면 (기준연도 − 출생연도), 지나지 않았으면 그 값에서 1을 뺀 값
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <AgeCalculatorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
